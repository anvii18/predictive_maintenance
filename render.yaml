services:
  - type: web
    name: failureguard-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python deploy_backend.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FAILUREGUARD_API_HOST
        value: 0.0.0.0
